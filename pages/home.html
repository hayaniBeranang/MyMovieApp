<!DOCTYPE html>
<html>
<head>
    <title>MyMovie</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<nav class="navbar">
    <h1 class="logo">MyMovie</h1>

    <div class="nav-links">
        <a href="home.html">Home</a>
        <a href="watchlist.html">Watchlist</a>
    </div>
</nav>

<section class="hero">
    <h1>Discover Amazing Movies</h1>
    <p>Search, Watch and Save Your Favorites</p>

    <div class="search-box">
        <input
            type="text"
            id="movieInput"
            placeholder="Search movie...">

        <button id="searchBtn" class="btn">
            Search
        </button>
    </div>
</section>

<div class="container">

    <div id="result"></div>

    <section class="card-section">
        <h2>Movie Recommendation</h2>

        <select id="genre">
            <option>Action</option>
            <option>Comedy</option>
            <option>Horror</option>
            <option>Animation</option>
        </select>

        <button
            class="btn"
            onclick="recommendMovie()">
            Recommend
        </button>

        <p id="recommendation"></p>
    </section>

    <section class="card-section">
        <h2>Watch Time Calculator</h2>

        <input
            type="number"
            id="runtime"
            placeholder="Movie runtime (minutes)">

        <input
            type="number"
            id="quantity"
            placeholder="Number of movies">

        <button
            class="btn"
            onclick="calculateTime()">
            Calculate
        </button>

        <p id="totalTime"></p>
    </section>

</div>

<script src="../js/home.js"></script>

</body>
</html>
